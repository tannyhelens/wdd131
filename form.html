<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form">
    <meta name="author" content="Tanny Santos">

    <title>Product Review</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>
                    Select a Product ...
                </option>
            </select>

            <label>Overall Rating</label>

            <div class="rating">
                <label>☆<br>
                    <input type="radio" id="rating1" name="rating" value="1" required>
                </label>

                <label>☆☆<br>
                    <input type="radio" id="rating2" name="rating" value="2">
                </label>

                <label>☆☆☆<br>
                    <input type="radio" id="rating3" name="rating" value="3">
                </label>

                <label>☆☆☆☆<br>
                    <input type="radio" id="rating4" name="rating" value="4">
                </label>

                <label>☆☆☆☆☆<br>
                    <input type="radio" id="rating5" name="rating" value="5">
                </label>
            </div>

            <label for="installDate">Date of Installation</label>
            <input
                type="date"
                id="installDate"
                name="installDate"
                required>

            <label>Useful Features</label>
            <p><em>(Check all that apply)</em></p>

            <label>
                <input type="checkbox"
                    id="durability"
                    name="features"
                    value="Durability">
                Durability
            </label>

            <label>
                <input type="checkbox"
                    id="ease"
                    name="features"
                    value="Ease of Use">
                Ease of Use
            </label>

            <label>
                <input type="checkbox"
                    id="performance"
                    name="features"
                    value="Performance">
                Performance
            </label>

            <label>
                <input type="checkbox"
                    id="design"
                    name="features"
                    value="Design">
                Design
            </label>

            <label for="review">
                Written Review <span class="optional">(Optional)</span>
            </label>

            <textarea id="review" name="review"></textarea>

            <label for="username">
                Your Name <span class="optional">(Optional)</span>
            </label>

            <input type="text" id="username" name="username">

            <input type="submit" value="Post Review">

        </form>
    </main>

    <footer>
        <p>
             © <span id="currentyear"></span> 🌸 Tanny Santos 🌸 United States
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
