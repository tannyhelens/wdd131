<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="A beautiful page about Utah with weather, geography, and interesting facts.">

    <meta name="author" content="Tanny Santos">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Utah Place Page</title>

    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">

    <script src="scripts/place.js" defer></script>
</head>

<body>

    <header>
        <h1>Utah</h1>
    </header>

    <main>

        <!-- Hero Image -->
        <section class="hero">
            <picture>
                <source srcset="images/utah-large.webp" media="(min-width: 768px)">
                <img src="images/utah-small.webp" alt="Arches National Park in Utah">
            </picture>
        </section>

        <!-- Data Section -->
        <section class="data">
            <h2>Data</h2>

            <p><strong>Area:</strong> 84,899 sq mi</p>
            <p><strong>Population:</strong> 3.4 million</p>
            <p><strong>Capital:</strong> Salt Lake City</p>
            <p><strong>Language:</strong> English</p>
            <p><strong>Currency:</strong> US Dollar</p>
            <p><strong>Time Zone:</strong> MST</p>
        </section>

        <!-- Weather Section -->
        <section class="weather">
            <h2>Weather</h2>

            <img src="images/weather.svg" alt="Weather Icon" class="weather-icon">

            <p><strong>Temperature:</strong> <span id="temperature">8</span> °C</p>
            <p><strong>Wind Speed:</strong> <span id="windspeed">10</span> km/h</p>
            <p><strong>Wind Chill:</strong> <span id="windchill"></span></p>
        </section>

    </main>

    <footer>
        <p>© <span id="currentyear"></span> 🌸 Tanny Santos 🌸 Utah</p>
        <p id="lastModified"></p>
    </footer>

</body>
</html>
